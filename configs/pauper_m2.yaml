# Full MAPLE on the Pauper decks with a hidden-hand network: pauper_m1 with perfect_obs off; worlds that differ only in the opponent's hand merge when the observer acts.
# Merged worlds halve its evaluations a simulation (1.97 against pauper_m1's ~4.0), so it searches twice the simulations, four leaves a round
# (~8 evaluations a round, as pauper_m1 and P0f), and 630 games a generation for P0f's ~2.2M evaluations (1,795 a game at 16/3 sims in generations 1-2).
name: pauper_m2
pairings: all
generations: 20
games_per_gen: 630
parallel: 128
sims: 31
cheap_sims: 6
leaves_per_step: 4
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 31
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
maple_worlds: 5
maple_select: union
perfect_obs: false
world_sampler: scored
world_candidates: 50
world_temp: 0.0
sampler_rows_per_game: 32
sampler_buffer: 50000
sampler_batch: 256
sampler_start_gen: 1
collisions: true
