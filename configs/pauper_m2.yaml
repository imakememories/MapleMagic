# Full MAPLE on the Pauper decks with a hidden-hand network: pauper_m1 with perfect_obs off; worlds that differ only in the opponent's hand merge when the observer acts.
# 480 games a generation (pauper_m1's) until calibrated.
name: pauper_m2
pairings: all
generations: 20
games_per_gen: 480
parallel: 128
sims: 16
cheap_sims: 3
leaves_per_step: 2
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 16
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
maple_worlds: 5
maple_select: union
perfect_obs: false
world_sampler: scored
world_candidates: 50
world_temp: 0.0
sampler_rows_per_game: 32
sampler_buffer: 50000
sampler_batch: 256
sampler_start_gen: 1
collisions: true
