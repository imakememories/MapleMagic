# MAPLE-r, seen hand, on the Pauper decks: the control for pauper_m1, with 5 random worlds instead of learned ones; everything else the same.
name: pauper_m1r
pairings: all
generations: 20
games_per_gen: 610
parallel: 128
sims: 16
cheap_sims: 3
leaves_per_step: 2
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 16
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
maple_worlds: 5
maple_select: union
perfect_obs: true
world_sampler: uniform
collisions: true
