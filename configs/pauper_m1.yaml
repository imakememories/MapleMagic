# Full MAPLE (arXiv 2605.24139) on the Pauper decks: 5 worlds picked from 50 by a Siamese sampler trained with the network; the network sees each world's guessed hand.
# Otherwise it searches like IS-MCTS with collisions, the Pauper baseline (two leaves a round, about IS-MCTS's eight one-evaluation leaves).
# 480 games a generation: 4,601 evaluations a game in generations 1-2 (26 a move, games of ~175 decisions), so this matches the Pauper baseline's ~2.2M a generation.
name: pauper_m1
pairings: all
generations: 20
games_per_gen: 480
parallel: 128
sims: 16
cheap_sims: 3
leaves_per_step: 2
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 16
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
maple_worlds: 5
maple_select: union
perfect_obs: true
world_sampler: scored
world_candidates: 50
world_temp: 0.0
sampler_rows_per_game: 32
sampler_buffer: 50000
sampler_batch: 256
sampler_start_gen: 1
collisions: true
