# IS-MCTS with learned worlds on the Pauper decks: P0f with each simulation's world drawn from the 16 best of 50 uniform hands, scored by a Siamese sampler trained with the network.
# 690 games a generation (P0f's) until calibrated.
name: pauper_m3
pairings: all
generations: 20
games_per_gen: 690
parallel: 256
sims: 64
cheap_sims: 10
leaves_per_step: 8
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 64
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
collisions: true
world_sampler: scored
world_candidates: 50
world_pool: 16
world_temp: 0.0
sampler_rows_per_game: 32
sampler_buffer: 50000
sampler_batch: 256
sampler_start_gen: 1
