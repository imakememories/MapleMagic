# S6e with collisions: a simulation that reaches a node awaiting its evaluation stops and ends the batch.
# 461 games a generation: its games run ~1.5x as long as S6e's (4,855 evaluations a game in generations 1-2 against 3,242), so this matches S6e's ~2.24M self-play evaluations a generation.
name: ognis_s9
pairings: [[Ognis, Ognis]]
generations: 20
games_per_gen: 461
parallel: 256
sims: 64
leaves_per_step: 8
temp_decisions: 40
buffer_size: 200000
batch_size: 512
reuse: 4.0
d_model: 192
layers: 1
eval_every: 5
eval_games: 128
eval_sims: 64
heuristic_sims: 200
seed: 0
value_positions_per_game: 16
value_reuse: 2.0
value_target: td
value_lambda: 0.95
full_search_prob: 0.25
init_std: 0.02
lr_warmup: 500
lr_cosine: true
collisions: true
