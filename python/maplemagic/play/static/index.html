<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleMagic play</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <form id="new">
    agent <select name="agent"><option value="network">network</option><option value="heuristic">heuristic</option></select>
    sims <input name="sims" value="400" size="4">
    seat <select name="seat"><option>random</option><option>0</option><option>1</option></select>
    seed <input name="seed" size="9" placeholder="random">
    <button>New game</button>
  </form>
  <label><input type="checkbox" id="debug"> Show the agent's thinking (reveals its hand)</label>
</header>
<main>
  <section id="table">
    <div id="opponent" class="area"></div>
    <div id="middle">
      <div id="phase"></div>
      <div id="stack"></div>
      <div id="actions"></div>
    </div>
    <div id="you" class="area"></div>
  </section>
  <aside id="side">
    <img id="preview" alt="" hidden>
    <div id="thinking" hidden></div>
    <h4>Log</h4>
    <pre id="log"></pre>
  </aside>
</main>
<div id="popup" hidden></div>
<script type="module" src="app.js"></script>
</body></html>
