[package]
name = "mmz-engine"
version = "0.1.0"
edition.workspace = true
description = "MTG rules engine trimmed from jackmaiorino/mtg-kernel (MIT)"

[lib]
name = "mtg_kernel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", features = ["compress"] }

[build-dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
